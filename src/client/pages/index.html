<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <base href="/pages/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Multi</title>
    <script defer src="https://cloud.umami.is/script.js"
        data-website-id="b1e153b5-b1ff-463c-82d1-de998f1cf1c4"
        data-domains="tetra-arena.duckdns.org"></script>
    <script>
        (() => {
            const savedTheme = localStorage.getItem("theme")
            const prefersDark = window.matchMedia?.("(prefers-color-scheme: dark)")?.matches
            document.documentElement.dataset.theme = savedTheme || (prefersDark ? "dark" : "light")
        })()
    </script>
    <style>
        :root {
            color-scheme: light;
            --initial-bg: #f8fafc;
            --initial-bg-soft: #f1f5f9;
            background: #f8fafc;
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --initial-bg: #0f172a;
            --initial-bg-soft: #1e293b;
            background: #0f172a;
        }

        html,
        body {
            min-height: 100%;
            background: linear-gradient(135deg, var(--initial-bg-soft) 0%, var(--initial-bg) 100%);
        }
    </style>
    <link rel="stylesheet" href="../styles/style.css">
</head>

<body>
    <div id="indexRoot"></div>

    <script type="module" src="./index.tsx"></script>
</body>

</html>
