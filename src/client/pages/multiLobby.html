<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>멀티플레이 로비 - Tetris Multi</title>
    <script>
        (() => {
            const savedTheme = localStorage.getItem("theme")
            const prefersDark = window.matchMedia?.("(prefers-color-scheme: dark)")?.matches
            document.documentElement.dataset.theme = savedTheme || (prefersDark ? "dark" : "light")
        })()
    </script>
    <style>
        :root {
            color-scheme: light;
            --initial-bg: #f8fafc;
            --initial-bg-soft: #f1f5f9;
            background: #f8fafc;
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --initial-bg: #0f172a;
            --initial-bg-soft: #1e293b;
            background: #0f172a;
        }

        html,
        body {
            min-height: 100%;
            background: linear-gradient(135deg, var(--initial-bg-soft) 0%, var(--initial-bg) 100%);
        }
    </style>
    <link rel="stylesheet" href="../styles/style.css">
</head>

<body>
    <div id="multiLobbyRoot"></div>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="./multiLobby.tsx"></script>
</body>

</html>
