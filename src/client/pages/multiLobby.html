<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>멀티플레이 로비 - Tetris Multi</title>
    <script>
        (() => {
            const savedTheme = localStorage.getItem("theme")
            const prefersDark = window.matchMedia?.("(prefers-color-scheme: dark)")?.matches
            document.documentElement.dataset.theme = savedTheme || (prefersDark ? "dark" : "light")
        })()
    </script>
    <style>
        :root {
            color-scheme: light;
            --initial-bg: #f8fafc;
            --initial-bg-soft: #f1f5f9;
            background: #f8fafc;
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --initial-bg: #0f172a;
            --initial-bg-soft: #1e293b;
            background: #0f172a;
        }

        html,
        body {
            min-height: 100%;
            background: linear-gradient(135deg, var(--initial-bg-soft) 0%, var(--initial-bg) 100%);
        }
    </style>
    <link rel="stylesheet" href="../styles/style.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <h1 class="brand">Multi Lobby</h1>
            <nav class="nav">
                <button id="soundToggle" type="button" class="btn ghost" aria-pressed="false">사운드 켜기</button>
                <button id="themeToggle" type="button" class="btn ghost" aria-pressed="false">다크 모드</button>
                <a href="./index.html" class="btn ghost">← 홈으로</a>
            </nav>
        </header>

        <main class="main" style="padding-top: 10px;">
            <div class="lobby-grid">
                <section class="card chat-panel">
                    <h2 class="card-title" style="margin-bottom: 4px;">Chat</h2>
                    <div class="chat-messages" id="chatMessages">
                        <div class="chat-msg"><span class="system">[System]</span> 전체 채팅 또는 방 채팅을 선택해서 메시지를 보낼 수 있습니다.
                        </div>
                    </div>
                    <form class="chat-input-group" id="chatForm">
                        <select id="chatScope" class="input-box chat-scope" aria-label="채팅 범위">
                            <option value="global">전체</option>
                            <option value="room">방</option>
                        </select>
                        <input type="text" id="chatInput" class="input-box" placeholder="메시지를 입력하세요..."
                            autocomplete="off">
                        <button type="submit" class="btn primary">전송</button>
                    </form>
                </section>

                <section class="action-panel">
                    <div class="action-box profile-box">
                        <div class="avatar">
                            <span id="playerAvatarChar">G</span>
                        </div>
                        <div class="profile-details">
                            <span class="profile-meta">My Profile</span>
                            <div class="profile-name-row">
                                <span class="profile-name" id="playerNicknameText">Guest</span>
                                <span class="host-badge" id="playerHostBadge" hidden>방장</span>
                            </div>
                            <div class="room-badge" id="lobbyRoomBadge">
                                <span class="room-badge-dot"></span>
                                <span class="room-badge-text" id="lobbyRoomBadgeText">로비 대기 중</span>
                            </div>
                        </div>
                    </div>

                    <div class="action-box">
                        <h3 id="primaryActionTitle">Quick Match</h3>
                        <p id="primaryActionDesc">방을 만들거나 코드로 참가하면 게임 시작 상태를 확인할 수 있습니다.</p>
                        <button id="btnPrimaryAction" class="btn primary btn-match" type="button" disabled>방 대기 중</button>
                    </div>

                    <div class="action-box">
                        <h3>Join by Code</h3>
                        <p>상대가 만든 방 코드로 참가할 수 있습니다.</p>
                        <div class="join-group">
                            <input type="text" id="roomCodeInput" class="input-box input-code" placeholder="ENTER CODE"
                                maxlength="8">
                            <button id="btnJoinCode" class="btn" type="button">방 입장</button>
                            <button id="btnLeaveRoom" class="btn" type="button">방 나가기</button>
                        </div>
                    </div>

                    <div class="action-box" style="padding: 16px;">
                        <p style="text-align:center; font-size:0.85rem;">방을 만들고 상대에게 코드를 공유하세요.</p>
                        <button id="btnCreateRoom" class="btn ghost" style="width:100%;" type="button">방 생성</button>
                        <div id="roomStatus" class="room-status" hidden>
                            <div class="room-status-row">
                                <span>방 코드</span>
                                <div class="room-code-group">
                                    <strong id="roomCodeText">-</strong>
                                    <button id="btnCopyRoomCode" class="room-copy-btn" type="button">복사</button>
                                </div>
                            </div>
                            <div class="room-status-row">
                                <span>상태</span>
                                <strong id="roomStateText">-</strong>
                            </div>
                            <div class="room-status-row">
                                <span>플레이어</span>
                                <strong><span id="roomPlayerCountText">0</span> / 2</strong>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module">
        import { initLobbySound } from "../game/runtime/sound.js"
        import { queryElement, requireElement } from "../game/entry/dom.js"
        import { applySavedTheme, toggleTheme } from "../game/entry/theme.js"
        import {
            requestCreateRoom,
            onRoomResult,
            requestJoinRoom,
            onRoomUpdated,
            onRoomMessage,
            requestLeaveRoom,
            requestStartGame,
            requestRoomSync,
            sendGlobalChat,
            sendRoomChat,
            onGlobalMessage,
            onChatResult,
        } from "../net/roomClient.js"

        // =============================
        // DOM References
        // 로비 화면에서 반복해서 사용할 필수/선택 요소를 한 번만 조회한다.
        // =============================
        const themeToggleBtn = queryElement(document, "#themeToggle")
        const soundToggleBtn = queryElement(document, "#soundToggle")
        const chatForm = requireElement(document, "#chatForm", "lobby")
        const chatScope = requireElement(document, "#chatScope", "lobby")
        const chatInput = requireElement(document, "#chatInput", "lobby")
        const messages = requireElement(document, "#chatMessages", "lobby")
        const roomStatus = requireElement(document, "#roomStatus", "lobby")
        const roomCodeText = requireElement(document, "#roomCodeText", "lobby")
        const roomStateText = requireElement(document, "#roomStateText", "lobby")
        const roomPlayerCountText = requireElement(document, "#roomPlayerCountText", "lobby")
        const copyRoomCodeBtn = requireElement(document, "#btnCopyRoomCode", "lobby")
        const playerNicknameText = requireElement(document, "#playerNicknameText", "lobby")
        const playerAvatarChar = requireElement(document, "#playerAvatarChar", "lobby")
        const playerHostBadge = requireElement(document, "#playerHostBadge", "lobby")
        const primaryActionTitle = requireElement(document, "#primaryActionTitle", "lobby")
        const primaryActionDesc = requireElement(document, "#primaryActionDesc", "lobby")
        const primaryActionBtn = requireElement(document, "#btnPrimaryAction", "lobby")
        const lobbyRoomBadge = requireElement(document, "#lobbyRoomBadge", "lobby")
        const lobbyRoomBadgeText = requireElement(document, "#lobbyRoomBadgeText", "lobby")

        applySavedTheme(themeToggleBtn)

        // =============================
        // Chat UI
        // 시스템/사용자 메시지를 채팅 패널에 누적해서 보여준다.
        // =============================
        /**
         * 채팅 패널에 메시지 한 줄을 추가하고, 최신 메시지가 보이도록 스크롤을 내린다.
         *
         * @param {string} sender - 메시지 보낸 사람 (닉네임 또는 "system")
         * @param {string} text - 화면에 출력할 메시지 본문
         * @param {"global" | "room" | null} scope - 메시지 범위
         * @returns {void}
         */
        const appendMessage = (sender, text, scope = null) => {
            const div = document.createElement("div")
            div.className = "chat-msg"

            const tag = document.createElement("span")
            tag.className = sender === "system" ? "system" : "user"

            if (sender === "system") {
                tag.textContent = "[System]"
            } else {
                const scopeLabel = scope === "global" ? "전체 " : scope === "room" ? "방 " : ""
                tag.textContent = `[${scopeLabel}${sender}]`
            }

            div.append(tag, document.createTextNode(` ${text}`))
            messages.appendChild(div)
            messages.scrollTop = messages.scrollHeight
        }

        // =============================
        // Common UI Events
        // 테마 토글, 로컬 채팅 입력, 방 코드 복사처럼 로비 공통 상호작용을 처리한다.
        // =============================
        const onToggleTheme = () => toggleTheme(themeToggleBtn)
        const onSubmitChat = (event) => {
            event.preventDefault()
            const message = chatInput.value.trim()
            if (!message) return

            if (chatScope.value === "room") {
                if (!currentRoomId) {
                    appendMessage("system", "방에 입장한 뒤 방 채팅을 사용할 수 있습니다.")
                    return
                }

                sendRoomChat(currentRoomId, currentPlayer.playerId, message)
            } else {
                sendGlobalChat(currentPlayer, message)
            }

            chatInput.value = ""
        }
        const onCopyRoomCode = async () => {
            const roomId = roomCodeText.textContent.trim()
            if (!roomId || roomId === "-") {
                appendMessage("system", "복사할 방 코드가 없습니다.")
                return
            }

            try {
                await navigator.clipboard.writeText(roomId)
                appendMessage("system", `방 코드 ${roomId}를 복사했습니다.`)
            } catch {
                appendMessage("system", `복사에 실패했습니다. 방 코드: ${roomId}`)
            }
        }
        const onClickPrimaryAction = () => {
            appendMessage("system", "게임 시작을 요청했습니다.")
            requestStartGame(currentRoomId, currentPlayer.playerId)
        }

        // =============================
        // Global Event Wiring
        // 로비에 진입하면 공통 UI 리스너와 로비 BGM을 연결하고, pagehide 시 정리한다.
        // =============================
        themeToggleBtn?.addEventListener("click", onToggleTheme)
        chatForm.addEventListener("submit", onSubmitChat)
        copyRoomCodeBtn.addEventListener("click", onCopyRoomCode)
        primaryActionBtn.addEventListener("click", onClickPrimaryAction)
        const cleanupSound = initLobbySound(soundToggleBtn)
        let detachGlobalMessage = null
        let detachChatResult = null

        window.addEventListener("pagehide", () => {
            themeToggleBtn?.removeEventListener("click", onToggleTheme)
            chatForm.removeEventListener("submit", onSubmitChat)
            copyRoomCodeBtn.removeEventListener("click", onCopyRoomCode)
            primaryActionBtn.removeEventListener("click", onClickPrimaryAction)
            detachGlobalMessage?.()
            detachChatResult?.()
            cleanupSound?.()
        }, { once: true })

        // =============================
        // Room Actions
        // 방 생성, 참가 요청, 방 나가기 처럼 사용자가 roomClient에 명령을 보내는 진입점이다.
        // =============================
        const btnCreateRoom = queryElement(document, "#btnCreateRoom")
        const btnLeaveRoom = queryElement(document, "#btnLeaveRoom")

        function createGuestNickname() {
            return `Guest${Math.floor(1000 + Math.random() * 9000)}`
        }

        function getSavedNickname() {
            const savedNickname = sessionStorage.getItem("tetris:nickname")?.trim()
            if (savedNickname) return savedNickname

            const guestNickname = createGuestNickname()
            sessionStorage.setItem("tetris:nickname", guestNickname)
            return guestNickname
        }
        function getSavedPlayerId() {
            const savedPlayerId = sessionStorage.getItem("tetris:playerId")
            if (savedPlayerId) return savedPlayerId

            const playerId = crypto.randomUUID()
            sessionStorage.setItem("tetris:playerId", playerId)
            return playerId
        }
        const currentPlayer = {
            playerId: getSavedPlayerId(),
            nickname: getSavedNickname(),
        }

        function updateRoomBadge(roomId) {
            if (roomId) {
                lobbyRoomBadge.classList.add("active")
                lobbyRoomBadgeText.textContent = `방 코드: ${roomId}`
            } else {
                lobbyRoomBadge.classList.remove("active")
                lobbyRoomBadgeText.textContent = "로비 대기 중"
            }
        }

        function saveRoomSession(room) {
            sessionStorage.setItem("tetris:roomId", room.roomId)
            sessionStorage.setItem("room", JSON.stringify(room))
        }

        function clearRoomSession() {
            sessionStorage.removeItem("tetris:roomId")
            sessionStorage.removeItem("room")
        }

        // 현재 플레이어 정보를 UI에 반영한다.
        playerNicknameText.textContent = currentPlayer.nickname
        playerAvatarChar.textContent = currentPlayer.nickname.charAt(0).toUpperCase()
        renderPrimaryAction(null)

        // 세션에 저장된 룸 ID가 있는 경우 UI 반영 및 자동 방 참가 요청
        const savedRoomId = sessionStorage.getItem("tetris:roomId")
        if (savedRoomId) {
            requestRoomSync(savedRoomId, currentPlayer.playerId)
        } else {
            updateRoomBadge(null)
        }

        btnCreateRoom?.addEventListener("click", () => {
            requestCreateRoom(currentPlayer)
        })
        btnLeaveRoom?.addEventListener("click", () => {
            if (!currentRoomId) {
                appendMessage("system", "존재하지 않는 방입니다.")
                return
            }

            leaveRoom(currentRoomId, currentPlayer.playerId)
        })


        // =============================
        // Room State Rendering
        // 서버/roomService에서 받은 방 스냅샷을 현재 로비 상태 UI에 반영한다.
        // =============================
        /**
         * 방 코드, 상태, 인원 수를 현재 room 상태 패널에 동기화한다.
         *
         * @param {{roomId: string, status: string, players: Array<unknown>}} room - 반영할 현재 방 상태
         * @returns {void}
         */
        let currentRoomId = null;
        function renderPrimaryAction(room) {
            if (!room) {
                primaryActionTitle.textContent = "Quick Match"
                primaryActionDesc.textContent = "방을 만들거나 코드로 참가하면 게임 시작 상태를 확인할 수 있습니다."
                primaryActionBtn.textContent = "방 대기 중"
                primaryActionBtn.disabled = true
                return
            }

            const isHost = room.hostPlayerId === currentPlayer.playerId
            const canStartGame = isHost && room.status === "waiting" && room.players.length === 2

            primaryActionTitle.textContent = "Game Start"
            primaryActionBtn.textContent = "게임 시작"

            if (room.status === "finished") {
                primaryActionDesc.textContent = "상대가 로비로 돌아오면 다시 시작할 수 있습니다."
                primaryActionBtn.textContent = "상대 로비 대기중"
                primaryActionBtn.disabled = true
                return
            }

            if (!isHost) {
                primaryActionDesc.textContent = "방장이 게임을 시작할 수 있습니다."
                primaryActionBtn.textContent = "방장 대기중"
                primaryActionBtn.disabled = true
                return
            }

            if (!canStartGame) {
                primaryActionDesc.textContent = "상대가 입장하면 게임을 시작할 수 있습니다."
                primaryActionBtn.disabled = true
                return
            }

            primaryActionDesc.textContent = "두 명이 모였습니다. 게임 시작 준비가 가능합니다."
            primaryActionBtn.disabled = false
        }

        function renderRoom(room) {
            currentRoomId = room.roomId;
            saveRoomSession(room)
            updateRoomBadge(room.roomId)
            roomStatus.hidden = false
            roomCodeText.textContent = room.roomId
            roomStateText.textContent = room.status
            roomPlayerCountText.textContent = String(room.players.length)
            playerHostBadge.hidden = room.hostPlayerId !== currentPlayer.playerId
            renderPrimaryAction(room)
        }

        function clearRoom() {
            currentRoomId = null
            clearRoomSession()
            updateRoomBadge(null)
            roomStatus.hidden = true
            roomCodeText.textContent = "-"
            roomStateText.textContent = "-"
            roomPlayerCountText.textContent = "0"
            playerHostBadge.hidden = true
            renderPrimaryAction(null)
        }

        // =============================
        // Room Client Subscriptions
        // roomClient가 밀어주는 상태 변화/메시지/요청 결과를 받아 화면에 반영한다.
        // =============================
        onRoomUpdated((room) => {
            if (!room) return
            if (room.status === "playing") {
                // 서버의 room:updated broadcast가 로비에서 게임 화면으로 넘어가는 트리거다.
                saveRoomSession(room)
                sessionStorage.setItem("tetris:playerId", currentPlayer.playerId);
                location.href = `/pages/tetrisMulti.html?roomId=${room.roomId}`
                return;
            }
            renderRoom(room)
        })

        onRoomMessage((message) => {
            if (!message) return
            if (message.type === "chat") {
                appendMessage(message.nickname || "Guest", message.text || "", "room")
                return
            }

            appendMessage("system", message.text || "")
        })

        detachGlobalMessage = onGlobalMessage((message) => {
            if (!message) return
            appendMessage(message.nickname || "Guest", message.text || "", "global")
        })

        detachChatResult = onChatResult((result) => {
            if (!result || result.ok) return
            appendMessage("system", result.reason || "CHAT_ERROR")
        })

        // requestType은 서버 응답 필드가 아니라 roomClient가 기억한 마지막 요청 종류다.
        onRoomResult((result, requestType) => {
            if (!result.ok) {
                if (requestType === "sync") {
                    clearRoom()
                }

                if (requestType === "join" && result.reason === "ROOM_NOT_FOUND") {
                    clearRoom()
                }
                appendMessage("system", result.reason)
                return
            }


            if (requestType === "leave") {
                appendMessage("system", `방에서 퇴장했습니다.`)
                clearRoom()
                return
            }

            const { room } = result
            if (!room) return;
            renderRoom(room)
            if (requestType === "create") {
                appendMessage("system", `방이 생성되었습니다. 코드: ${room.roomId}`)
            }

            if (requestType === "join") {
                appendMessage("system", `방에 입장했습니다. 코드: ${room.roomId}`)
            }

        })

        // =============================
        // Join By Code
        // 입력된 방 코드를 검증한 뒤 roomClient를 통해 참가 요청을 보낸다.
        // =============================
        const roomCodeInput = requireElement(document, "#roomCodeInput", "lobby")
        const joinCodeBtn = requireElement(document, "#btnJoinCode", "lobby")
        joinCodeBtn.addEventListener("click", () => {
            const roomId = roomCodeInput.value.trim().toUpperCase()

            if (!roomId) {
                appendMessage("system", "방 코드를 입력해주세요.")
                return
            }

            requestJoinRoom(roomId, currentPlayer)
        })

        function leaveRoom(roomId, currentPlayerId) {
            if (!roomId) {
                appendMessage("system", "방 코드를 입력해주세요.")
                return;
            }
            requestLeaveRoom(roomId, currentPlayerId)
        }



    </script>
</body>

</html>
