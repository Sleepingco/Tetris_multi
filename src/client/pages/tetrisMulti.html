<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Tetris</title>
    <script>
        (() => {
            const savedTheme = localStorage.getItem("theme")
            const prefersDark = window.matchMedia?.("(prefers-color-scheme: dark)")?.matches
            document.documentElement.dataset.theme = savedTheme || (prefersDark ? "dark" : "light")
        })()
    </script>
    <style>
        :root {
            color-scheme: light;
            --initial-game-bg: #f8fafc;
            background: #f8fafc;
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --initial-game-bg: #0f172a;
            background: #0f172a;
        }

        html,
        body {
            min-height: 100%;
            background: var(--initial-game-bg);
        }
    </style>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/tetris.css">
</head>

<body>
    <div class="multi-wrapper">
        <header class="multi-header">
            <div class="multi-title">
                <h1>Multiplayer Tetris</h1>
                <div class="room-info-badge" id="multiRoomBadge" style="display: none;">
                    <span class="room-dot"></span>
                    <span id="roomCodeText">방 코드: -</span>
                </div>
                <p>2인 멀티 MVP</p>
            </div>
            <div class="multi-actions">
                <button id="themeToggle" class="sound-toggle" type="button" aria-pressed="false">다크 모드</button>
                <a class="home-btn" href="./index.html">홈으로</a>
            </div>
        </header>

        <main class="multi-grid">
            <section class="player-column" data-player="1">
                <div class="player-header">
                    <div class="player-id-wrap">
                        <div class="player-id" id="player1Name">Player 1</div>
                        <span id="player1RoleBadge">-</span>
                    </div>
                    <div class="player-stats">
                        <div class="stat">
                            <span class="label">Score</span>
                            <span class="score">0</span>
                        </div>
                        <div class="stat">
                            <span class="label">Lines</span>
                            <span class="lines">0</span>
                        </div>
                        <div class="stat stat--incoming">
                            <span class="label">Incoming</span>
                            <span class="pending-garbage" data-player="1">0</span>
                            <span class="garbage-log" data-player="1" aria-live="polite"></span>
                        </div>
                    </div>
                </div>

                <div class="player-panels">
                    <aside class="panel panel--left">
                        <div class="panel-section">
                            <h2>Hold</h2>
                            <div class="hold-preview" data-player="1"></div>
                        </div>
                        <div class="panel-section">
                            <h2>Next Up</h2>
                            <div class="next-preview" data-player="1"></div>
                        </div>
                    </aside>

                    <section class="playfield playfield--multi">
                        <div class="game-text" data-player="1">
                            <span>대기중</span>
                        </div>
                        <div class="playground" data-player="1">
                            <canvas class="tetrisBoardCanvas" width="300" height="600">

                            </canvas>
                        </div>
                    </section>
                </div>
            </section>

            <section class="player-column" data-player="2">
                <div class="player-header">
                    <div class="player-id-wrap">
                        <div class="player-id" id="player2Name">Player 2</div>
                        <span id="player2RoleBadge">-</span>
                    </div>
                    <div class="player-stats">
                        <div class="stat">
                            <span class="label">Score</span>
                            <span class="score">0</span>
                        </div>
                        <div class="stat">
                            <span class="label">Lines</span>
                            <span class="lines">0</span>
                        </div>
                        <div class="stat stat--incoming">
                            <span class="label">Incoming</span>
                            <span class="pending-garbage" data-player="2">0</span>
                            <span class="garbage-log" data-player="2" aria-live="polite"></span>
                        </div>
                    </div>
                </div>

                <div class="player-panels">
                    <aside class="panel panel--left">
                        <div class="panel-section">
                            <h2>Hold</h2>
                            <div class="hold-preview" data-player="2"></div>
                        </div>
                        <div class="panel-section">
                            <h2>Next Up</h2>
                            <div class="next-preview" data-player="2"></div>
                        </div>
                    </aside>

                    <section class="playfield playfield--multi">
                        <div class="game-text" data-player="2">
                            <span>대기중</span>
                        </div>
                        <div class="playground" data-player="2">
                            <canvas class="tetrisBoardCanvas" width="300" height="600">

                            </canvas>
                        </div>
                    </section>
                </div>
            </section>
        </main>
    </div>
    <script src="/socket.io/socket.io.js"></script>

    <script type="module">

        import { queryElement } from "../game/entry/dom.js"
        import { applySavedTheme, toggleTheme } from "../game/entry/theme.js"
        import { createTetrisRuntime } from "../game/runtime/tetris.js"
        import { attachKeyboardInput } from "../game/runtime/input.js"
        import { shouldCorrectSnapshot } from "../game/runtime/snapshotCorrection.js"
        import { requestJoinGameRoom, onGameJoinResult, sendGameSnapshot, receiveSnapshot, leaveGame, onGameOpponentLeft, onGameSnapshotResult, sendGameOver, onMatchFinish, onGameOverResult, requestLeaveRoom, sendGameInput, receiveGameInput, onGameInputResult, requestGameBagChunk, receiveGameBagAppend, onGameBagResult, sendGarbageAttack, receiveGarbageAppend, onGarbageResult } from "../net/roomClient.js"
        import { sendPlacementDecisionLog, onPlacementDecisionLogResult } from "../net/logClient.js"
        const themeToggleBtn = queryElement(document, "#themeToggle")
        const player1Name = queryElement(document, "#player1Name")
        const player2Name = queryElement(document, "#player2Name")
        const multiRoomBadge = queryElement(document, "#multiRoomBadge")
        const roomCodeText = queryElement(document, "#roomCodeText")
        const player1RoleBadge = queryElement(document, "#player1RoleBadge")
        const player2RoleBadge = queryElement(document, "#player2RoleBadge")
        const homeBtn = queryElement(document, ".home-btn")
        // off      snapshot 무시
        // apply    항상 applySnapshot
        // correct 다를 때만 applySnapshot
        const SNAPSHOT_MODE = "correct"
        applySavedTheme(themeToggleBtn)
        onPlacementDecisionLogResult((result) => {
            if (!result?.ok) {
                console.warn("placement_decision log save failed:", result?.reason)
            }
        })

        function clearRoomSession() {
            sessionStorage.removeItem("tetris:roomId")
            sessionStorage.removeItem("room")
        }

        function redirectToLobby() {
            clearRoomSession()
            location.replace("./multiLobby.html")
        }

        function readStoredRoom() {
            const roomJson = sessionStorage.getItem("room")
            if (!roomJson) return null

            try {
                return JSON.parse(roomJson)
            } catch {
                clearRoomSession()
                return null
            }
        }

        function hasValidRoomSession(room, playerId) {
            return Boolean(
                playerId
                && room?.roomId
                && Array.isArray(room.players)
                && room.players.some(player => player.playerId === playerId)
            )
        }

        function setPlayerGameText(playerNumber, text) {
            const gameTextEl = document.querySelector(`.game-text[data-player="${playerNumber}"]`)
            const textEl = gameTextEl?.querySelector("span")
            if (textEl) {
                textEl.textContent = text
            }
            if (gameTextEl) {
                gameTextEl.style.display = "flex"
            }
        }

        function addLobbyButton(playerNumber, onClick) {
            const gameTextEl = document.querySelector(`.game-text[data-player="${playerNumber}"]`)
            if (!gameTextEl || gameTextEl.querySelector(".match-lobby-btn")) return

            const lobbyButton = document.createElement("button")
            lobbyButton.className = "match-lobby-btn"
            lobbyButton.type = "button"
            lobbyButton.textContent = "로비로"
            lobbyButton.addEventListener("click", () => {
                onClick()
            })

            gameTextEl.append(lobbyButton)
        }

        function getPlayerBagChunks(match, targetPlayerId) {
            const matchPlayer = match?.players?.find(player => player.playerId === targetPlayerId)
            return Array.isArray(matchPlayer?.bagChunks) ? matchPlayer.bagChunks : null
        }

        /**
         * 멀티 게임 세션을 시작한다.
         * - 내 runtime, 상대 runtime, socket listener, snapshot timer, cleanup handle을 함께 구성한다.
         * - 현재 MVP에서는 내 보드는 로컬 입력으로 실행하고, 상대 보드는 input relay와 snapshot correction으로 보정한다.
         *
         * @param {Object} params - 멀티 게임 세션 구성 요소
         * @returns {Object} runtime과 정리 함수를 포함한 게임 세션
         */
        function startMultiplayerGame({
            roomId,
            playerId,
            opponentPlayerId,
            match,
            myCanvas,
            opponentCanvas,
            myNextPreviewEl,
            myHoldPreviewEl,
            myScoreEl,
            myLinesEl,
            myPendingGarbageEl,
            myGarbageLogEl,
            opponentNextPreviewEl,
            opponentHoldPreviewEl,
            opponentScoreEl,
            opponentLinesEl,
            opponentPendingGarbageEl,
            opponentGarbageLogEl,
        }) {
            const myBagChunks = getPlayerBagChunks(match, playerId)
            const opponentBagChunks = getPlayerBagChunks(match, opponentPlayerId)
            const gameId = match?.createdAt
                ? `${roomId}-${match.createdAt}`
                : roomId
            const myGame = createTetrisRuntime({
                boardCanvasEl: myCanvas,
                scoreEl: myScoreEl,
                linesEl: myLinesEl,
                pendingGarbageEl: myPendingGarbageEl,
                garbageLogEl: myGarbageLogEl,
                nextPreviewEl: myNextPreviewEl,
                holdPreviewEl: myHoldPreviewEl,
                mode: "multi",
                gameId,
                roomId,
                playerId,
                placementDecisionRecorder(log) {
                    // 클라이언트가 계산한 배치 로그와 공격 줄을 서버에 보고하는 MVP 경계다.
                    sendPlacementDecisionLog(roomId, playerId, log)
                    const attackLines = log?.placementResult?.attackLines ?? 0
                    if (attackLines > 0) {
                        sendGarbageAttack(roomId, playerId, attackLines)
                    }
                },
            })
            myGame.init({ autoStart: true, serverBagChunks: myBagChunks })
            myGame.runtime.detachKeyboard = attachKeyboardInput({
                enqueueAction: (action) => {
                    const input = myGame.enqueueInput(action, null, myGame.runtime.pieceIndex)
                    if (!input) return

                    sendGameInput(roomId, playerId, input.action, input.tick, input.pieceIndex)
                },
            })
            const opponentGame = createTetrisRuntime({
                boardCanvasEl: opponentCanvas,
                scoreEl: opponentScoreEl,
                linesEl: opponentLinesEl,
                pendingGarbageEl: opponentPendingGarbageEl,
                garbageLogEl: opponentGarbageLogEl,
                nextPreviewEl: opponentNextPreviewEl,
                holdPreviewEl: opponentHoldPreviewEl,
                mode: "multi",
                gameId,
                roomId,
                playerId: opponentPlayerId,
            })
            // 상대 보드는 현재 input relay + snapshot correction 기반으로 예측 실행한다.
            // autoStart를 false로 두면 snapshot 도착 시점에만 갱신되어 움직임이 크게 끊긴다.
            // 서버 authoritative runtime으로 전환하기 전까지는 true를 유지한다.
            opponentGame.init({ autoStart: true, serverBagChunks: opponentBagChunks })
            let hasReportedGameOver = false
            let hasPendingBagRequest = false
            const bagLowWatermark = 7

            /**
             * server bag 잔량이 낮아지면 한 번만 추가 chunk를 요청한다.
             * - hasPendingBagRequest로 같은 구간의 중복 요청을 막는다.
             *
             * @returns {void}
             */
            function requestBagIfNeeded() {
                if (!hasPendingBagRequest && myGame.getServerBagRemainingCount() <= bagLowWatermark) {
                    hasPendingBagRequest = true
                    requestGameBagChunk(roomId, playerId)
                }
            }
            function reportGameOverIfNeeded(snapshot) {
                if (!hasReportedGameOver && snapshot.phase === "gameOver") {
                    hasReportedGameOver = true
                    sendGameOver(roomId, playerId, "top_out")
                }
            }
            // 주기적으로 내 snapshot을 보내고, bag 보충과 game over 보고도 같은 heartbeat에서 처리한다.
            const snapshotTimer = setInterval(() => {
                const snapshot = myGame.getSnapshot()
                sendGameSnapshot(roomId, playerId, snapshot)
                requestBagIfNeeded()
                reportGameOverIfNeeded(snapshot)
            }, 500)

            const detachSnapshotResult = onGameSnapshotResult((result) => {
                if (result.ok) return
                console.warn("game:snapshot failed:", result.reason)
            })
            const detachReceiveSnapshot = receiveSnapshot(({ playerId: remotePlayerId, snapshot }) => {
                if (remotePlayerId === playerId) return
                if (!snapshot || !Array.isArray(snapshot.board)) {
                    console.error("Invalid snapshot from", remotePlayerId)
                    return
                }
                // snapshot은 상대 runtime 보정용이다. 입력 relay보다 늦게 도착할 수 있어 모드별로 적용 범위를 제한한다.
                if (SNAPSHOT_MODE === "apply") {
                    opponentGame.applySnapshot(snapshot)
                    return
                }

                if (SNAPSHOT_MODE === "correct") {
                    const localSnapshot = opponentGame.getSnapshot()

                    if (shouldCorrectSnapshot(localSnapshot, snapshot)) {
                        opponentGame.applySnapshot(snapshot)
                    }
                }

            })
            const detachGameOverResult = onGameOverResult((result) => {
                if (result.ok) return
                console.warn("game:over failed:", result.reason)
            })
            const detachGameInput = receiveGameInput(({ playerId: remotePlayerId, action, tick, pieceIndex }) => {
                if (remotePlayerId === playerId) return
                // 상대 입력은 상대 보드 runtime에 enqueue해서 먼저 예측 실행하고, 이후 snapshot으로 오차를 보정한다.
                opponentGame.enqueueInput(action, tick, pieceIndex)
            })
            const detachGameInputResult = onGameInputResult((result) => {
                if (result.ok) return
                console.warn("game:input failed:", result.reason)
            })
            const detachGarbageAppend = receiveGarbageAppend((payload) => {
                const { targetPlayerId, lines, holeCol } = payload
                if (targetPlayerId === playerId) {
                    myGame.queueGarbageLines({ lines, holeCol })
                    return
                }

                if (targetPlayerId === opponentPlayerId) {
                    opponentGame.queueGarbageLines({ lines, holeCol })
                }
            })
            const detachGarbageResult = onGarbageResult((result) => {
                if (result.ok) return
                console.warn("game:garbage failed:", result.reason)
            })
            const detachGameBagAppend = receiveGameBagAppend(({ playerId: bagPlayerId, bagChunk }) => {
                if (!Array.isArray(bagChunk)) return

                if (bagPlayerId === playerId) {
                    myGame.appendServerBag(bagChunk)
                    hasPendingBagRequest = false
                    return
                }

                if (bagPlayerId === opponentPlayerId) {
                    opponentGame.appendServerBag(bagChunk)
                }
            })
            const detachGameBagResult = onGameBagResult((result) => {
                if (result.ok) return
                hasPendingBagRequest = false
                console.warn("game:bag failed:", result.reason)
            })

            return {
                myGame,
                opponentGame,
                snapshotTimer,
                detachSnapshotResult,
                detachReceiveSnapshot,
                detachGameOverResult,
                detachGameInput,
                detachGameInputResult,
                detachGarbageAppend,
                detachGarbageResult,
                detachGameBagAppend,
                detachGameBagResult,
            }
        }

        // 세션에서 방 정보와 player 정보를 불러온다. 서버 검증 실패 시 로비로 되돌린다.
        const playerId = sessionStorage.getItem("tetris:playerId")
        const room = readStoredRoom()

        if (!hasValidRoomSession(room, playerId)) {
            redirectToLobby()
        } else {
            const roomId = room.roomId
            const hostPlayer = room.players.find(player => player.playerId === room.hostPlayerId)
            const guestPlayer = room.players.find(player => player.playerId !== room.hostPlayerId)
            const myRole = playerId === room.hostPlayerId ? "host" : "guest"

            console.log("room : ", room)
            console.log("playerId : ", playerId)
            console.log("hostPlayer : ", hostPlayer)
            console.log("guestPlayer : ", guestPlayer)
            console.log("myRole : ", myRole)

            if (player1Name) {
                player1Name.textContent = hostPlayer?.nickname || "Host"
            }

            if (player2Name) {
                player2Name.textContent = guestPlayer?.nickname || "Guest"
            }

            if (roomCodeText) {
                roomCodeText.textContent = `방 코드: ${roomId}`
            }

            if (multiRoomBadge) {
                multiRoomBadge.style.display = "inline-flex"
            }

            if (myRole === "host") {
                player1RoleBadge.textContent = "내 보드"
                player2RoleBadge.textContent = "상대 보드"
            } else {
                player1RoleBadge.textContent = "상대 보드"
                player2RoleBadge.textContent = "내 보드"
            }

            const onToggleTheme = () => toggleTheme(themeToggleBtn)
            themeToggleBtn?.addEventListener("click", onToggleTheme)

            // 플레이어 캔버스 지정
            const player1Canvas = queryElement(document, '.playground[data-player="1"] .tetrisBoardCanvas')
            const player2Canvas = queryElement(document, '.playground[data-player="2"] .tetrisBoardCanvas')
            const player1Score = queryElement(document, '.player-column[data-player="1"] .score')
            const player2Score = queryElement(document, '.player-column[data-player="2"] .score')
            const player1Lines = queryElement(document, '.player-column[data-player="1"] .lines')
            const player2Lines = queryElement(document, '.player-column[data-player="2"] .lines')
            const player1NextPreview = queryElement(document, '.next-preview[data-player="1"]')
            const player2NextPreview = queryElement(document, '.next-preview[data-player="2"]')
            const player1HoldPreview = queryElement(document, '.hold-preview[data-player="1"]')
            const player2HoldPreview = queryElement(document, '.hold-preview[data-player="2"]')
            const player1PendingGarbage = queryElement(document, '.pending-garbage[data-player="1"]')
            const player2PendingGarbage = queryElement(document, '.pending-garbage[data-player="2"]')
            const player1GarbageLog = queryElement(document, '.garbage-log[data-player="1"]')
            const player2GarbageLog = queryElement(document, '.garbage-log[data-player="2"]')
            const myCanvas = myRole === "host" ? player1Canvas : player2Canvas
            const opponentCanvas = myRole === "host" ? player2Canvas : player1Canvas
            const myScoreEl = myRole === "host" ? player1Score : player2Score
            const myLinesEl = myRole === "host" ? player1Lines : player2Lines
            const myNextPreviewEl = myRole === "host" ? player1NextPreview : player2NextPreview
            const myHoldPreviewEl = myRole === "host" ? player1HoldPreview : player2HoldPreview
            const myPendingGarbageEl = myRole === "host" ? player1PendingGarbage : player2PendingGarbage
            const myGarbageLogEl = myRole === "host" ? player1GarbageLog : player2GarbageLog
            const opponentScoreEl = myRole === "host" ? player2Score : player1Score
            const opponentLinesEl = myRole === "host" ? player2Lines : player1Lines
            const opponentNextPreviewEl = myRole === "host" ? player2NextPreview : player1NextPreview
            const opponentHoldPreviewEl = myRole === "host" ? player2HoldPreview : player1HoldPreview
            const opponentPendingGarbageEl = myRole === "host" ? player2PendingGarbage : player1PendingGarbage
            const opponentGarbageLogEl = myRole === "host" ? player2GarbageLog : player1GarbageLog

            console.log("myCanvas : ", myCanvas)
            console.log("opponentCanvas : ", opponentCanvas)

            const player1Column = queryElement(document, '[data-player="1"]')
            const player2Column = queryElement(document, '[data-player="2"]')
            const myColumn = myRole === "host" ? player1Column : player2Column
            myColumn?.classList.add("is-mine")

            let gameSession = null
            let shouldNotifyGameLeave = true
            let hasMatchFinished = false

            /**
             * 멀티 게임 세션에서 만든 timer, socket listener, runtime을 모두 정리한다.
             * - 누락되면 재입장 시 중복 snapshot 전송이나 중복 입력 처리가 발생할 수 있다.
             *
             * @returns {void}
             */
            function cleanupGameSession() {
                if (!gameSession) return

                clearInterval(gameSession.snapshotTimer)
                gameSession.detachSnapshotResult()
                gameSession.detachReceiveSnapshot()
                gameSession.detachGameOverResult()
                gameSession.detachGameInput()
                gameSession.detachGameInputResult()
                gameSession.detachGarbageAppend()
                gameSession.detachGarbageResult()
                gameSession.detachGameBagAppend()
                gameSession.detachGameBagResult()
                gameSession.myGame.destroy()
                gameSession.opponentGame.destroy()
                gameSession = null
            }

            function moveToHome() {
                clearRoomSession()
                setTimeout(() => {
                    location.replace("./index.html")
                }, 50)
            }

            function handleHomeClick(event) {
                event.preventDefault()
                shouldNotifyGameLeave = false

                if (hasMatchFinished) {
                    requestLeaveRoom(roomId, playerId)
                } else {
                    leaveGame(roomId, playerId)
                }

                cleanupGameSession()
                moveToHome()
            }

            homeBtn?.addEventListener("click", handleHomeClick)

            // match 종료 이벤트를 받으면 runtime을 멈추고 결과를 표시한 뒤 로비 복귀 버튼만 남긴다.
            const detachMatchFinish = onMatchFinish((result) => {
                cleanupGameSession()
                hasMatchFinished = true

                if (result.room) {
                    sessionStorage.setItem("tetris:roomId", result.room.roomId)
                    sessionStorage.setItem("room", JSON.stringify(result.room))
                }

                const hostResultText = result.winnerPlayerId === hostPlayer?.playerId ? "승리" : "패배"
                const guestResultText = result.winnerPlayerId === guestPlayer?.playerId ? "승리" : "패배"

                setPlayerGameText("1", hostResultText)
                setPlayerGameText("2", guestResultText)
                shouldNotifyGameLeave = false
                addLobbyButton(myRole === "host" ? "1" : "2", () => {
                    location.replace("./multiLobby.html")
                })
                detachMatchFinish()
            })

            onGameJoinResult((result) => {
                if (!result.ok) {
                    redirectToLobby()
                    return
                }

                if (result.room) {
                    sessionStorage.setItem("tetris:roomId", result.room.roomId)
                    sessionStorage.setItem("room", JSON.stringify(result.room))
                }

                if (gameSession) return

                const opponentPlayerId = myRole === "host" ? guestPlayer?.playerId : hostPlayer?.playerId
                const myBagChunks = getPlayerBagChunks(result.match, playerId)
                const opponentBagChunks = getPlayerBagChunks(result.match, opponentPlayerId)

                console.log("game:join result:", result)
                console.log("my bag chunks:", myBagChunks)
                console.log("opponent bag chunks:", opponentBagChunks)

                gameSession = startMultiplayerGame({
                    roomId,
                    playerId,
                    opponentPlayerId,
                    match: result.match,
                    myCanvas,
                    opponentCanvas,
                    myNextPreviewEl,
                    myHoldPreviewEl,
                    myScoreEl,
                    myLinesEl,
                    myPendingGarbageEl,
                    myGarbageLogEl,
                    opponentNextPreviewEl,
                    opponentHoldPreviewEl,
                    opponentScoreEl,
                    opponentLinesEl,
                    opponentPendingGarbageEl,
                    opponentGarbageLogEl,
                })
            })

            requestJoinGameRoom(roomId, playerId)

            onGameOpponentLeft(({ room: updatedRoom }) => {
                cleanupGameSession()
                if (updatedRoom) {
                    sessionStorage.setItem("tetris:roomId", updatedRoom.roomId)
                    sessionStorage.setItem("room", JSON.stringify(updatedRoom))
                }
                shouldNotifyGameLeave = false
                location.replace("./multiLobby.html")
            })
            window.addEventListener("pagehide", () => {
                themeToggleBtn?.removeEventListener("click", onToggleTheme)
                homeBtn?.removeEventListener("click", handleHomeClick)
                detachMatchFinish()
                if (shouldNotifyGameLeave) {
                    leaveGame(roomId, playerId);
                }
                cleanupGameSession()
            }, { once: true })
        }
