<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Tetris</title>
    <script>
        (() => {
            const savedTheme = localStorage.getItem("theme")
            const prefersDark = window.matchMedia?.("(prefers-color-scheme: dark)")?.matches
            document.documentElement.dataset.theme = savedTheme || (prefersDark ? "dark" : "light")
        })()
    </script>
    <style>
        :root {
            color-scheme: light;
            --initial-game-bg: #f8fafc;
            background: #f8fafc;
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --initial-game-bg: #0f172a;
            background: #0f172a;
        }

        html,
        body {
            min-height: 100%;
            background: var(--initial-game-bg);
        }
    </style>
    <link rel="stylesheet" href="../styles/tetris.css">
</head>

<body>
    <div id="multiplayerRoot"></div>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="./tetrisMulti.tsx"></script>
</body>

</html>
