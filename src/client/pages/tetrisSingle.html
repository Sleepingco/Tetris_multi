<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single Player Tetris</title>
    <script defer src="https://cloud.umami.is/script.js"
        data-website-id="b1e153b5-b1ff-463c-82d1-de998f1cf1c4"
        data-domains="tetra-arena.duckdns.org"></script>
    <script>
        (() => {
            const savedTheme = localStorage.getItem("theme")
            const prefersDark = window.matchMedia?.("(prefers-color-scheme: dark)")?.matches
            document.documentElement.dataset.theme = savedTheme || (prefersDark ? "dark" : "light")
        })()
    </script>
    <style>
        :root {
            color-scheme: light;
            --initial-game-bg: #f8fafc;
            background: #f8fafc;
        }
        :root[data-theme="dark"] {
            color-scheme: dark;
            --initial-game-bg: #0f172a;
            background: #0f172a;
        }
        html,
        body {
            min-height: 100%;
            background: var(--initial-game-bg);
        }
    </style>
    <link rel="stylesheet" href="../styles/tetris.css">
</head>
<body>
    <div id="singleRoot"></div>
    <script type="module" src="./tetrisSingle.tsx"></script>
</body>
</html>
