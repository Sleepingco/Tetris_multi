name: Production deployment

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Commit SHA to deploy (leave empty to deploy the selected workflow ref)
        required: false
        type: string

      rollback_image_tag:
        description: Existing image tag compatible with the NEW DB version (required for schema upgrades)
        required: false
        type: string
      rollback_artifact_sha256:
        description: Artifact checksum label of that rollback image (provide together with tag)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  ssh-check:
    name: Deploy and verify production
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 45

    steps:
      - name: Check out selected commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_ref || github.sha }}

      - name: Create release artifact
        shell: bash
        run: |
          set -euo pipefail

          release_commit="$(git rev-parse --verify 'HEAD^{commit}')"
          release_sha="${release_commit:0:7}"
          artifact="$RUNNER_TEMP/tetris-${release_sha}.tar.gz"

          git archive --format=tar "$release_commit" | gzip -n > "$artifact"
          (
              cd "$(dirname "$artifact")"
              sha256sum "$(basename "$artifact")" > "$(basename "$artifact").sha256"
          )
          artifact_sha256="$(sha256sum "$artifact" | awk '{print $1}')"
          tar -tzf "$artifact" >/dev/null

          printf 'release_commit=%s\n' "$release_commit" >> "$GITHUB_ENV"
          printf 'release_sha=%s\n' "$release_sha" >> "$GITHUB_ENV"
          printf 'artifact_sha256=%s\n' "$artifact_sha256" >> "$GITHUB_ENV"
          printf 'artifact=%s\n' "$artifact" >> "$GITHUB_ENV"

      - name: Verify release commit passed main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          successful_ci_runs="$(gh run list \
            --workflow ci.yml \
            --commit "$release_commit" \
            --limit 100 \
            --json status,conclusion,event,headBranch \
            --jq '[.[] | select(.status == "completed" and .conclusion == "success" and .event == "push" and .headBranch == "main")] | length')"

          if test "$successful_ci_runs" -eq 0; then
            printf 'RELEASE_COMMIT_HAS_NO_SUCCESSFUL_MAIN_CI=%s\n' "$release_commit" >&2
            exit 1
          fi

          printf 'release commit passed main CI: %s\n' "$release_commit"

      - name: Validate deployment destination and rollback inputs
        env:
          OCI_HOST: ${{ vars.OCI_HOST }}
          OCI_USER: ${{ vars.OCI_USER }}
          OCI_SSH_PORT: ${{ vars.OCI_SSH_PORT }}
          OCI_INCOMING_DIR: ${{ vars.OCI_INCOMING_DIR }}
          ROLLBACK_IMAGE_TAG: ${{ inputs.rollback_image_tag }}
          ROLLBACK_ARTIFACT_SHA256: ${{ inputs.rollback_artifact_sha256 }}
        run: |
          set -euo pipefail
          [[ "$OCI_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$OCI_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$OCI_SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          (( 10#$OCI_SSH_PORT > 0 && 10#$OCI_SSH_PORT <= 65535 ))
          test "$OCI_INCOMING_DIR" = /srv/tetris/incoming
          if test -n "$ROLLBACK_IMAGE_TAG" || test -n "$ROLLBACK_ARTIFACT_SHA256"; then
              [[ "$ROLLBACK_IMAGE_TAG" =~ ^[0-9a-f]{7,40}$ ]]
              [[ "$ROLLBACK_ARTIFACT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          fi

      - name: Prepare SSH files
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          ssh_dir="$RUNNER_TEMP/tetris-ssh"
          install -d -m 700 "$ssh_dir"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/id_rsa"
          printf '%s\n' "$KNOWN_HOSTS" > "$ssh_dir/known_hosts"

          chmod 600 "$ssh_dir/id_rsa" "$ssh_dir/known_hosts"

      - name: Transfer and verify artifact
        env:
          OCI_HOST: ${{ vars.OCI_HOST }}
          OCI_USER: ${{ vars.OCI_USER }}
          OCI_SSH_PORT: ${{ vars.OCI_SSH_PORT }}
          OCI_INCOMING_DIR: ${{ vars.OCI_INCOMING_DIR }}
        run: |
          set -euo pipefail

          test -n "$OCI_INCOMING_DIR"
          remote_artifact="$OCI_INCOMING_DIR/tetris-${release_sha}.tar.gz"
          remote_checksum="$remote_artifact.sha256"

          scp \
            -i "$RUNNER_TEMP/tetris-ssh/id_rsa" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/tetris-ssh/known_hosts" \
            -P "$OCI_SSH_PORT" \
            "$artifact" \
            "$artifact.sha256" \
            "$OCI_USER@$OCI_HOST:$OCI_INCOMING_DIR/"

          ssh \
            -i "$RUNNER_TEMP/tetris-ssh/id_rsa" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/tetris-ssh/known_hosts" \
            -p "$OCI_SSH_PORT" \
            "$OCI_USER@$OCI_HOST" \
            "RELEASE_SHA='$release_sha' REMOTE_ARTIFACT='$remote_artifact' REMOTE_CHECKSUM='$remote_checksum' EXPECTED_ARTIFACT_SHA256='$artifact_sha256' sh -s" <<'REMOTE'
          set -eu

          test -s "$REMOTE_ARTIFACT"
          test -s "$REMOTE_CHECKSUM"
          (cd "$(dirname "$REMOTE_ARTIFACT")" && sha256sum -c "$(basename "$REMOTE_CHECKSUM")")
          actual_artifact_sha256=$(sha256sum "$REMOTE_ARTIFACT" | awk '{print $1}')
          test "$actual_artifact_sha256" = "$EXPECTED_ARTIFACT_SHA256"
          tar -tzf "$REMOTE_ARTIFACT" >/dev/null
          printf 'OCI artifact verified: %s\n' "$RELEASE_SHA"
          REMOTE

      - name: Prepare candidate image
        env:
          OCI_HOST: ${{ vars.OCI_HOST }}
          OCI_USER: ${{ vars.OCI_USER }}
          OCI_SSH_PORT: ${{ vars.OCI_SSH_PORT }}
          OCI_INCOMING_DIR: ${{ vars.OCI_INCOMING_DIR }}
        run: |
          set -euo pipefail

          ssh \
            -i "$RUNNER_TEMP/tetris-ssh/id_rsa" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/tetris-ssh/known_hosts" \
            -p "$OCI_SSH_PORT" \
            "$OCI_USER@$OCI_HOST" \
            "RELEASE_SHA='$release_sha' RELEASE_COMMIT='$release_commit' ARTIFACT_SHA256='$artifact_sha256' OCI_INCOMING_DIR='$OCI_INCOMING_DIR' sh -s" <<'REMOTE'
          set -eu

          artifact="$OCI_INCOMING_DIR/tetris-${RELEASE_SHA}.tar.gz"
          candidate_image="tetris-app:${RELEASE_SHA}"

          test -s "$artifact"
          case "$RELEASE_COMMIT" in
              *[!0-9a-f]*|'') echo "INVALID_RELEASE_COMMIT" >&2; exit 1 ;;
          esac
          test "${#RELEASE_COMMIT}" -eq 40
          case "$RELEASE_COMMIT" in
              "$RELEASE_SHA"*) ;;
              *) echo "RELEASE_SHA_COMMIT_MISMATCH" >&2; exit 1 ;;
          esac
          case "$ARTIFACT_SHA256" in
              *[!0-9a-f]*|'') echo "INVALID_ARTIFACT_SHA256" >&2; exit 1 ;;
          esac
          test "${#ARTIFACT_SHA256}" -eq 64
          sudo docker info >/dev/null

          if sudo docker image inspect "$candidate_image" >/dev/null 2>&1; then
              candidate_exists=yes
          else
              candidate_exists=no
          fi

          sudo install -d -o ubuntu -g ubuntu -m 750 /srv/tetris/builds
          build_directory=$(mktemp -d "/srv/tetris/builds/.${RELEASE_SHA}.XXXXXX")
          cleanupBuildDirectory() {
              rm -rf -- "$build_directory"
          }
          trap cleanupBuildDirectory EXIT
          tar -xzf "$artifact" -C "$build_directory"

          test -f "$build_directory/Dockerfile"
          test -f "$build_directory/compose.production.yml"
          test -f "$build_directory/package.json"
          # Host Compose와 Caddy 설정은 별도 검토 없이 교체하지 않는다.
          cmp "$build_directory/compose.production.yml" /srv/tetris/repository/compose.production.yml

          cd "$build_directory"

          sudo env APP_IMAGE_TAG="$RELEASE_SHA" \
              docker compose \
              --env-file /srv/tetris/secrets/production.env \
              -f compose.production.yml \
              config --quiet

          verifyCandidateImage() {
              image_details=$(sudo docker image inspect "$candidate_image" \
                  --format '{{.Architecture}} {{.Os}} {{.Config.User}} {{json .Config.Cmd}} {{index .Config.Labels "com.docker.compose.project"}} {{index .Config.Labels "com.docker.compose.service"}}') \
                  || return 1
              test "$image_details" = 'amd64 linux node ["node","dist/server/app.js"] tetris app' \
                  || return 1
              image_revision=$(sudo docker image inspect "$candidate_image" \
                  --format '{{index .Config.Labels "org.opencontainers.image.revision"}}') \
                  || return 1
              image_artifact_sha256=$(sudo docker image inspect "$candidate_image" \
                  --format '{{index .Config.Labels "com.tetris.release.artifact-sha256"}}') \
                  || return 1
              if test "$image_revision" != "$RELEASE_COMMIT" \
                  || test "$image_artifact_sha256" != "$ARTIFACT_SHA256"; then
                  echo "CANDIDATE_IMAGE_PROVENANCE_MISMATCH" >&2
                  return 1
              fi
          }

          if test "$candidate_exists" = yes; then
              if ! verifyCandidateImage; then
                  echo "Existing image cannot be safely reused; it was left untouched." >&2
                  exit 1
              fi
              printf 'verified existing candidate image: %s\n' "$candidate_image"
          else
              sudo env APP_IMAGE_TAG="$RELEASE_SHA" \
                  docker compose \
                  --env-file /srv/tetris/secrets/production.env \
                  -f compose.production.yml \
                  build \
                  --build-arg "RELEASE_COMMIT=${RELEASE_COMMIT}" \
                  --build-arg "RELEASE_ARTIFACT_SHA256=${ARTIFACT_SHA256}" \
                  app
              verifyCandidateImage
          fi

          sudo docker image inspect "$candidate_image" \
              --format \
              'tags={{json .RepoTags}} architecture={{.Architecture}} size={{.Size}}'

          printf 'candidate image prepared: %s\n' "$RELEASE_SHA"
          REMOTE

      - name: Back up, migrate and activate production app
        env:
          OCI_HOST: ${{ vars.OCI_HOST }}
          OCI_USER: ${{ vars.OCI_USER }}
          OCI_SSH_PORT: ${{ vars.OCI_SSH_PORT }}
          DEPLOY_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          ROLLBACK_IMAGE_TAG: ${{ inputs.rollback_image_tag }}
          ROLLBACK_ARTIFACT_SHA256: ${{ inputs.rollback_artifact_sha256 }}
        run: |
          set -euo pipefail
          ssh \
            -i "$RUNNER_TEMP/tetris-ssh/id_rsa" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/tetris-ssh/known_hosts" \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -p "$OCI_SSH_PORT" \
            "$OCI_USER@$OCI_HOST" \
            "RELEASE_SHA='$release_sha' RELEASE_COMMIT='$release_commit' ARTIFACT_SHA256='$artifact_sha256' DEPLOY_ID='$DEPLOY_ID' ROLLBACK_IMAGE_TAG='$ROLLBACK_IMAGE_TAG' ROLLBACK_ARTIFACT_SHA256='$ROLLBACK_ARTIFACT_SHA256' timeout --signal=TERM --kill-after=120 1200 bash -s" <<'REMOTE'
          # DEPLOY_REMOTE_BEGIN
          set -euo pipefail
          umask 077
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{7}$ ]]
          test "$RELEASE_SHA" = "${RELEASE_COMMIT:0:7}"
          [[ "$ARTIFACT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$DEPLOY_ID" =~ ^[0-9]+-[0-9]+$ ]]
          rollback_input=${ROLLBACK_IMAGE_TAG-}
          rollback_sha=${ROLLBACK_ARTIFACT_SHA256-}
          if test -n "$rollback_input" || test -n "$rollback_sha"; then
              [[ "$rollback_input" =~ ^[0-9a-f]{7,40}$ ]] || exit 1
              [[ "$rollback_sha" =~ ^[0-9a-f]{64}$ ]] || exit 1
          fi

          root=/srv/tetris
          state_dir="$root/deployments/$RELEASE_SHA-$DEPLOY_ID"
          env_file="$root/secrets/production.env"
          compose_file="$root/repository/compose.production.yml"
          public_url=https://tetra-arena.duckdns.org
          candidate="tetris-app:$RELEASE_SHA"
          maintenance=false
          cutover_started=false
          restore_created=false
          restore_db="deploy_verify_${RELEASE_SHA}_${DEPLOY_ID//-/_}"
          before_tag=
          after_tag=
          before_version=
          target_version=
          baseline=

          fail() { printf '%s\n' "$1" >&2; return 1; }
          compose() { sudo docker compose --env-file "$env_file" -f "$compose_file" "$@"; }
          sql() { sudo docker exec -e 'PGOPTIONS=-c statement_timeout=30000 -c lock_timeout=5000' tetris-postgres-1 psql -X -v ON_ERROR_STOP=1 -U postgres -d "${2:-tetris}" -At -c "$1"; }
          version() { sql 'SELECT max(version) FROM tetris_analytics.schema_migrations'; }
          field() { sed -n "s/^$1=//p" "$state_dir/state"; }
          status() { printf '%s\n' "$1" > "$state_dir/status.tmp" || return 1; mv "$state_dir/status.tmp" "$state_dir/status"; }
          snapshot() {
              local where=${1-}
              sql "SELECT count(*) || '|' || md5(COALESCE(string_agg(event_id || ':' || event_sha256 || ':' || ingested_at::text, E'\n' ORDER BY event_id), '')) FROM tetris_analytics.game_events $where" "${2:-tetris}"
          }
          profile() {
              sudo docker run --rm "$1" node -e 'const s=require("./dist/server/server/services/runtimeEventStorage.js"); const c=require("./dist/server/client/game/state/config.js"); console.log([s.EXPECTED_POSTGRES_MIGRATION_VERSION,c.BOARD_ROWS,c.BOARD_COLS].join("|"));'
          }
          image_id() { sudo docker image inspect "tetris-app:$1" --format '{{.Id}}'; }
          check_image() {
              local image="tetris-app:$1" details
              details=$(sudo docker image inspect "$image" --format '{{.Architecture}} {{.Os}} {{.Config.User}} {{json .Config.Cmd}}')
              test "$details" = 'amd64 linux node ["node","dist/server/app.js"]' || fail DEPLOY_IMAGE_RUNTIME_INVALID
          }
          health() {
              test "$(sudo docker inspect tetris-app-1 --format '{{.Config.Image}} {{.State.Status}} {{.State.Health.Status}} {{.State.OOMKilled}}')" = "tetris-app:$1 running healthy false"
          }
          http_status() { curl --max-time 20 --silent --show-error --output /dev/null --write-out '%{http_code}' "$public_url/"; }
          quiet() {
              local count sample
              for sample in 1 2 3; do
                  count=$(sudo docker exec tetris-app-1 node -e 'const fs=require("node:fs");let n=0;for(const p of ["/proc/net/tcp","/proc/net/tcp6"]){for(const l of fs.readFileSync(p,"utf8").trim().split("\n").slice(1)){const f=l.trim().split(/\s+/);if(f[1].endsWith(":157C")&&f[3]==="01")n++;}}console.log(n);') || return 1
                  [[ "$count" =~ ^[0-9]+$ ]] || return 1
                  if test "$count" != 0; then fail DEPLOY_ACTIVE_CONNECTIONS; return 1; fi
                  sleep 1 || return 1
              done
          }
          close_ingress() {
              sudo docker exec tetris-caddy-1 sh -c 'test "$(grep -c "reverse_proxy app:5500" /etc/caddy/Caddyfile)" -eq 1 && sed '\''s/reverse_proxy app:5500/respond "Server update in progress. Please refresh shortly." 503/'\'' /etc/caddy/Caddyfile > /tmp/tetris-deploy-maintenance.Caddyfile' || return 1
              sudo docker exec tetris-caddy-1 caddy validate --config /tmp/tetris-deploy-maintenance.Caddyfile --adapter caddyfile || return 1
              maintenance=true
              status maintenance || return 1
              sudo docker exec tetris-caddy-1 caddy reload --config /tmp/tetris-deploy-maintenance.Caddyfile --adapter caddyfile || return 1
              test "$(http_status)" = 503
          }
          open_ingress() {
              test "$(sha256sum "$root/repository/Caddyfile" | cut -d ' ' -f 1)" = "$(field CADDY_SHA)" || return 1
              sudo docker exec tetris-caddy-1 caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile || return 1
              test "$(http_status)" = 200 || return 1
              maintenance=false
          }
          set_tag() {
              local tag=$1 temporary
              [[ "$tag" =~ ^[0-9a-f]{7,40}$ ]] || return 1
              temporary=$(mktemp "$root/secrets/production.env.XXXXXX")
              if ! sed "s/^APP_IMAGE_TAG=.*/APP_IMAGE_TAG=$tag/" "$env_file" > "$temporary" \
                  || test "$(grep -c '^APP_IMAGE_TAG=' "$temporary")" -ne 1; then
                  rm -f -- "$temporary"
                  return 1
              fi
              if ! chmod 600 "$temporary" || ! mv "$temporary" "$env_file"; then
                  rm -f -- "$temporary"
                  return 1
              fi
          }
          replace_app() {
              set_tag "$1" || return 1
              compose up -d --no-deps --no-build --force-recreate --wait --wait-timeout 90 app || return 1
              health "$1"
          }
          recover() {
              local actual tag expected_id current
              actual=$(version) || return 1
              if test "$actual" = "$before_version"; then
                  tag=$before_tag
                  expected_id=$(field BEFORE_ID)
              elif test "$actual" = "$target_version"; then
                  tag=$after_tag
                  expected_id=$(field AFTER_ID)
              else
                  fail DEPLOY_ROLLBACK_SCHEMA_UNKNOWN
                  return 1
              fi
              test "$(image_id "$tag")" = "$expected_id" || return 1
              current=$(sudo docker inspect tetris-app-1 --format '{{.Image}}') || current=
              if test -n "$current" && test "$current" != "$(field CANDIDATE_ID)" && test "$current" != "$(field BEFORE_ID)" && test "$current" != "$(field AFTER_ID)"; then
                  fail DEPLOY_ROLLBACK_STALE
                  return 1
              fi
              if test "$maintenance" = false; then
                  if test "$(http_status)" = 503; then
                      maintenance=true
                  else
                      if test "$(sudo docker inspect tetris-app-1 --format '{{.State.Status}}' 2>/dev/null)" = running; then
                          quiet || return 1
                      fi
                  fi
              fi
              # 직전 reload가 실패했을 수도 있으므로 복구 교체 전에 차단을 다시 확인한다.
              close_ingress || return 1
              replace_app "$tag" || return 1
              open_ingress || return 1
              status rolled_back || return 1
              printf 'DEPLOY_ROLLBACK_VERIFIED=%s schema=%s\n' "$tag" "$actual"
          }
          cleanup() {
              local code=$?
              trap - EXIT
              if test "$restore_created" = true; then
                  if ! sudo docker exec tetris-postgres-1 dropdb -U postgres "$restore_db"; then
                      code=1
                      printf 'DEPLOY_RESTORE_CLONE_CLEANUP_FAILED\n' >&2
                  fi
              fi
              if test "$code" -ne 0 && test -f "$state_dir/state"; then
                  if test "$maintenance" = true || test "$cutover_started" = true; then
                      if ! recover; then status manual_recovery_required; fi
                  else
                      status failed_preflight
                  fi
              fi
              exit "$code"
          }

          mkdir -p "$root/deployments"
          exec 9> "$root/deployments/deploy.lock"
          flock -n 9 || fail DEPLOY_ALREADY_RUNNING
          trap cleanup EXIT
          trap 'exit 143' TERM HUP
          trap 'exit 130' INT

          test ! -e "$state_dir" || fail DEPLOY_STATE_EXISTS
          mkdir -m 700 "$state_dir"
          status preparing
          test "$(grep -c '^APP_IMAGE_TAG=' "$env_file")" -eq 1
          before_tag=$(sed -n 's/^APP_IMAGE_TAG=//p' "$env_file")
          [[ "$before_tag" =~ ^[0-9a-f]{7,40}$ ]] || fail DEPLOY_ACTIVE_TAG_INVALID
          check_image "$RELEASE_SHA"
          check_image "$before_tag"
          health "$before_tag"
          test "$(sudo docker inspect tetris-app-1 --format '{{.Image}}')" = "$(image_id "$before_tag")"
          test "$(sudo docker image inspect "$candidate" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$RELEASE_COMMIT"
          test "$(sudo docker image inspect "$candidate" --format '{{index .Config.Labels "com.tetris.release.artifact-sha256"}}')" = "$ARTIFACT_SHA256"
          IFS='|' read -r target_version rows cols <<< "$(profile "$candidate")"
          IFS='|' read -r before_version before_rows before_cols <<< "$(profile "tetris-app:$before_tag")"
          [[ "$target_version" =~ ^[1-9][0-9]*$ && "$before_version" =~ ^[1-9][0-9]*$ ]] || fail DEPLOY_PROFILE_INVALID
          test "$rows|$cols" = '40|10' || fail DEPLOY_GEOMETRY_UNSUPPORTED
          test "$(version)" = "$before_version" || fail DEPLOY_ACTIVE_SCHEMA_MISMATCH
          test "$target_version" -ge "$before_version" || fail DEPLOY_SCHEMA_DOWNGRADE_FORBIDDEN
          after_tag=$before_tag
          if test "$target_version" != "$before_version"; then
              test -n "$rollback_input" || fail DEPLOY_COMPATIBLE_ROLLBACK_REQUIRED
              after_tag=$rollback_input
          fi
          if test -n "$rollback_input"; then
              after_tag=$rollback_input
              check_image "$after_tag"
              test "$(sudo docker image inspect "tetris-app:$after_tag" --format '{{index .Config.Labels "com.tetris.release.artifact-sha256"}}')" = "$rollback_sha"
          fi
          IFS='|' read -r rollback_version rollback_rows rollback_cols <<< "$(profile "tetris-app:$after_tag")"
          test "$rollback_version" = "$target_version" || fail DEPLOY_ROLLBACK_SCHEMA_MISMATCH
          test "$rollback_cols" = 10
          [[ "$rollback_rows" = 20 || "$rollback_rows" = 40 ]]
          baseline=-
          write_state() {
              printf 'COMMIT=%s\nARTIFACT_SHA=%s\nBEFORE_TAG=%s\nBEFORE_ID=%s\nAFTER_TAG=%s\nAFTER_ID=%s\nBEFORE_VERSION=%s\nTARGET_VERSION=%s\nCANDIDATE_ID=%s\nCADDY_SHA=%s\nBASELINE=%s\n' \
                  "$RELEASE_COMMIT" "$ARTIFACT_SHA256" "$before_tag" "$(image_id "$before_tag")" "$after_tag" "$(image_id "$after_tag")" \
                  "$before_version" "$target_version" "$(image_id "$RELEASE_SHA")" "$(sha256sum "$root/repository/Caddyfile" | cut -d ' ' -f 1)" "$baseline" > "$state_dir/state.tmp"
              mv "$state_dir/state.tmp" "$state_dir/state"
          }
          write_state
          if test "$before_tag" = "$RELEASE_SHA"; then
              status unchanged
              printf 'DEPLOY_ALREADY_ACTIVE=%s\n' "$RELEASE_SHA"
              exit 0
          fi
          quiet
          baseline=$(snapshot)
          [[ "$baseline" =~ ^[0-9]+\|[0-9a-f]{32}$ ]]
          write_state
          backup="$root/backups/tetris-$RELEASE_SHA-$DEPLOY_ID.dump"
          mkdir -p "$root/backups"
          test ! -e "$backup"
          timeout 600 sudo docker exec tetris-postgres-1 pg_dump -U postgres -d tetris --format=custom --lock-wait-timeout=5000 > "$backup.tmp"
          test -s "$backup.tmp"
          sudo docker exec -i tetris-postgres-1 pg_restore --list < "$backup.tmp" > /dev/null
          mv "$backup.tmp" "$backup"
          chmod 400 "$backup"
          sha256sum "$backup" > "$state_dir/backup.sha256"
          printf '%s\n' "$backup" > "$state_dir/backup-path"
          sudo docker exec tetris-postgres-1 createdb -U postgres --owner=tetris_migration "$restore_db"
          restore_created=true
          timeout 600 sudo docker exec -i tetris-postgres-1 pg_restore -U postgres --exit-on-error --no-owner --role=tetris_migration --dbname="$restore_db" < "$backup"
          test "$(snapshot '' "$restore_db")" = "$baseline" || fail DEPLOY_BACKUP_RESTORE_MISMATCH
          test "$(snapshot)" = "$baseline" || fail DEPLOY_BACKUP_CHANGED_DURING_CAPTURE
          sudo docker exec tetris-postgres-1 dropdb -U postgres "$restore_db"
          restore_created=false
          status backup_verified
          quiet
          close_ingress
          compose stop --timeout 10 app
          cutover_started=true
          test "$(sudo docker inspect tetris-app-1 --format '{{.State.ExitCode}} {{.State.OOMKilled}}')" = '0 false'
          test "$(snapshot)" = "$baseline" || fail DEPLOY_BACKUP_STALE
          status migrating
          run_migration() {
              sudo docker run --rm --network tetris_database --mount "type=bind,src=$root/certs/ca.crt,dst=/run/secrets/postgres-ca.crt,readonly" \
                  --env-file "$root/secrets/migration.env" --env NODE_EXTRA_CA_CERTS=/run/secrets/postgres-ca.crt \
                  "$candidate" node dist/server/server/db/migrateCli.js
          }
          first=$(run_migration)
          [[ "$first" =~ ^PostgreSQL\ migrations\ applied=[0-9]+\ skipped=[0-9]+$ ]]
          second=$(run_migration)
          [[ "$second" =~ ^PostgreSQL\ migrations\ applied=0\ skipped=[1-9][0-9]*$ ]]
          test "$(version)" = "$target_version"
          test "$(snapshot)" = "$baseline" || fail DEPLOY_MIGRATION_CHANGED_EVENTS
          printf '%s\n%s\n' "$first" "$second" > "$state_dir/migration-result"
          # 실제 DB에서 호환 image를 기동한 뒤 후보로 교체한다. probe에 사용자 트래픽은 열지 않는다.
          replace_app "$after_tag"
          status rollback_boot_verified
          replace_app "$RELEASE_SHA"
          test "$(snapshot)" = "$baseline"
          open_ingress
          test "$(version)" = "$target_version"
          failures=$(sudo docker logs tetris-app-1 2>&1 | awk '/\[gameEventStorage\].*write_failed/{n++} END{print n+0}')
          test "$failures" = 0 || fail DEPLOY_STORAGE_WRITE_FAILED
          status complete
          printf 'DEPLOY_VERIFIED=%s schema=%s geometry=40x10\n' "$RELEASE_SHA" "$target_version"

          # DEPLOY_REMOTE_END
          REMOTE

      - name: Remove runner SSH credentials
        if: always()
        run: rm -f -- "$RUNNER_TEMP/tetris-ssh/id_rsa" "$RUNNER_TEMP/tetris-ssh/known_hosts"
