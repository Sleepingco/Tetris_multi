name: Production deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  ssh-check:
    name: Transfer production artifact
    runs-on: ubuntu-24.04
    environment: production

    steps:
      - name: Check out selected commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create release artifact
        shell: bash
        run: |
          set -euo pipefail

          release_sha="${GITHUB_SHA:0:7}"
          artifact="$RUNNER_TEMP/tetris-${release_sha}.tar.gz"

          git archive --format=tar.gz --output="$artifact" "$GITHUB_SHA"
          (
              cd "$(dirname "$artifact")"
              sha256sum "$(basename "$artifact")" > "$(basename "$artifact").sha256"
          )
          tar -tzf "$artifact" >/dev/null

          printf 'release_sha=%s\n' "$release_sha" >> "$GITHUB_ENV"
          printf 'artifact=%s\n' "$artifact" >> "$GITHUB_ENV"

      - name: Prepare SSH files
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          ssh_dir="$RUNNER_TEMP/tetris-ssh"
          install -d -m 700 "$ssh_dir"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/id_rsa"
          printf '%s\n' "$KNOWN_HOSTS" > "$ssh_dir/known_hosts"

          chmod 600 "$ssh_dir/id_rsa" "$ssh_dir/known_hosts"

      - name: Transfer and verify artifact
        env:
          OCI_HOST: ${{ vars.OCI_HOST }}
          OCI_USER: ${{ vars.OCI_USER }}
          OCI_SSH_PORT: ${{ vars.OCI_SSH_PORT }}
          OCI_INCOMING_DIR: ${{ vars.OCI_INCOMING_DIR }}
        run: |
          set -euo pipefail

          test -n "$OCI_INCOMING_DIR"
          remote_artifact="$OCI_INCOMING_DIR/tetris-${release_sha}.tar.gz"
          remote_checksum="$remote_artifact.sha256"

          scp \
            -i "$RUNNER_TEMP/tetris-ssh/id_rsa" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/tetris-ssh/known_hosts" \
            -P "$OCI_SSH_PORT" \
            "$artifact" \
            "$artifact.sha256" \
            "$OCI_USER@$OCI_HOST:$OCI_INCOMING_DIR/"

          ssh \
            -i "$RUNNER_TEMP/tetris-ssh/id_rsa" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/tetris-ssh/known_hosts" \
            -p "$OCI_SSH_PORT" \
            "$OCI_USER@$OCI_HOST" \
            "RELEASE_SHA='$release_sha' REMOTE_ARTIFACT='$remote_artifact' REMOTE_CHECKSUM='$remote_checksum' sh -s" <<'REMOTE'
          set -eu

          test -s "$REMOTE_ARTIFACT"
          test -s "$REMOTE_CHECKSUM"
          (cd "$(dirname "$REMOTE_ARTIFACT")" && sha256sum -c "$(basename "$REMOTE_CHECKSUM")")
          tar -tzf "$REMOTE_ARTIFACT" >/dev/null
          printf 'OCI artifact verified: %s\n' "$RELEASE_SHA"
          REMOTE

      - name: Prepare candidate image
        env:
          OCI_HOST: ${{ vars.OCI_HOST }}
          OCI_USER: ${{ vars.OCI_USER }}
          OCI_SSH_PORT: ${{ vars.OCI_SSH_PORT }}
          OCI_INCOMING_DIR: ${{ vars.OCI_INCOMING_DIR }}
        run: |
          set -euo pipefail

          ssh \
            -i "$RUNNER_TEMP/tetris-ssh/id_rsa" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/tetris-ssh/known_hosts" \
            -p "$OCI_SSH_PORT" \
            "$OCI_USER@$OCI_HOST" \
            "RELEASE_SHA='$release_sha' OCI_INCOMING_DIR='$OCI_INCOMING_DIR' sh -s" <<'REMOTE'
          set -eu

          artifact="$OCI_INCOMING_DIR/tetris-${RELEASE_SHA}.tar.gz"
          build_directory="/srv/tetris/builds/${RELEASE_SHA}"

          test -s "$artifact"
          test ! -e "$build_directory"

          sudo install -d \
              -o ubuntu \
              -g ubuntu \
              -m 750 \
              "$build_directory"

          tar -xzf "$artifact" -C "$build_directory"

          test -f "$build_directory/Dockerfile"
          test -f "$build_directory/compose.production.yml"
          test -f "$build_directory/package.json"

          cd "$build_directory"

          sudo env APP_IMAGE_TAG="$RELEASE_SHA" \
              docker compose \
              --env-file /srv/tetris/secrets/production.env \
              -f compose.production.yml \
              config --quiet

          sudo env APP_IMAGE_TAG="$RELEASE_SHA" \
              docker compose \
              --env-file /srv/tetris/secrets/production.env \
              -f compose.production.yml \
              build app

          sudo docker image inspect "tetris-app:${RELEASE_SHA}" \
              --format \
              'tags={{json .RepoTags}} architecture={{.Architecture}} size={{.Size}}'

          printf 'candidate image prepared: %s\n' "$RELEASE_SHA"
          REMOTE

      - name: Back up and verify production database
        env:
          OCI_HOST: ${{ vars.OCI_HOST }}
          OCI_USER: ${{ vars.OCI_USER }}
          OCI_SSH_PORT: ${{ vars.OCI_SSH_PORT }}
        run: |
          set -euo pipefail

          ssh \
            -i "$RUNNER_TEMP/tetris-ssh/id_rsa" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/tetris-ssh/known_hosts" \
            -p "$OCI_SSH_PORT" \
            "$OCI_USER@$OCI_HOST" \
            "RELEASE_SHA='$release_sha' sh -s" <<'REMOTE'
          set -eu
          umask 077

          case "$RELEASE_SHA" in
              *[!0-9a-f]*|'')
                  echo "INVALID_RELEASE_SHA" >&2
                  exit 1
                  ;;
          esac
          test "${#RELEASE_SHA}" -eq 7

          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          backup="/srv/tetris/backups/tetris-${RELEASE_SHA}-${timestamp}.dump"
          temporary="${backup}.tmp"

          sudo install -d -o ubuntu -g ubuntu -m 700 /srv/tetris/backups
          test ! -e "$backup"
          test ! -e "$temporary"

          cleanupTemporary() {
              test ! -e "$temporary" || rm -f -- "$temporary"
          }
          trap cleanupTemporary EXIT

          sudo docker compose \
              --env-file /srv/tetris/secrets/production.env \
              -f /srv/tetris/repository/compose.production.yml \
              exec -T postgres \
              pg_dump \
              --username postgres \
              --dbname tetris \
              --format=custom \
              > "$temporary"

          test -s "$temporary"
          sudo docker compose \
              --env-file /srv/tetris/secrets/production.env \
              -f /srv/tetris/repository/compose.production.yml \
              exec -T postgres \
              pg_restore --list \
              < "$temporary" \
              >/dev/null

          mv "$temporary" "$backup"
          chmod 400 "$backup"
          trap - EXIT

          sha256sum "$backup"
          stat -c '%a %U:%G %s %n' "$backup"
          printf 'production database backup verified: %s\n' "$backup"
          REMOTE

      - name: Apply and verify database migrations
        env:
          OCI_HOST: ${{ vars.OCI_HOST }}
          OCI_USER: ${{ vars.OCI_USER }}
          OCI_SSH_PORT: ${{ vars.OCI_SSH_PORT }}
        run: |
          set -euo pipefail

          ssh \
            -i "$RUNNER_TEMP/tetris-ssh/id_rsa" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/tetris-ssh/known_hosts" \
            -p "$OCI_SSH_PORT" \
            "$OCI_USER@$OCI_HOST" \
            "RELEASE_SHA='$release_sha' sh -s" <<'REMOTE'
          set -eu
          case "$RELEASE_SHA" in
              *[!0-9a-f]*|'')
                  echo "INVALID_RELEASE_SHA" >&2
                  exit 1
                  ;;
          esac
          test "${#RELEASE_SHA}" -eq 7

          runMigration() {
              sudo docker run --rm \
                  --network tetris_database \
                  --mount type=bind,src=/srv/tetris/certs/ca.crt,dst=/run/secrets/postgres-ca.crt,readonly \
                  --env-file /srv/tetris/secrets/migration.env \
                  --env NODE_EXTRA_CA_CERTS=/run/secrets/postgres-ca.crt \
                  "tetris-app:${RELEASE_SHA}" \
                  node dist/server/server/db/migrateCli.js
          }

          first_result="$(runMigration)"
          printf '%s\n' "$first_result"
          printf '%s\n' "$first_result" \
              | grep -Eq '^PostgreSQL migrations applied=[0-9]+ skipped=[0-9]+$'

          second_result="$(runMigration)"
          printf '%s\n' "$second_result"
          printf '%s\n' "$second_result" \
              | grep -Eq '^PostgreSQL migrations applied=0 skipped=[1-9][0-9]*$'

          printf 'database migrations verified: %s\n' "$RELEASE_SHA"
          REMOTE
