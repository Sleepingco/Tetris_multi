name: Production deployment

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Commit SHA to deploy (leave empty to deploy the selected workflow ref)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  ssh-check:
    name: Transfer production artifact
    runs-on: ubuntu-24.04
    environment: production

    steps:
      - name: Check out selected commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_ref || github.sha }}

      - name: Create release artifact
        shell: bash
        run: |
          set -euo pipefail

          release_commit="$(git rev-parse --verify 'HEAD^{commit}')"
          release_sha="${release_commit:0:7}"
          artifact="$RUNNER_TEMP/tetris-${release_sha}.tar.gz"

          git archive --format=tar "$release_commit" | gzip -n > "$artifact"
          (
              cd "$(dirname "$artifact")"
              sha256sum "$(basename "$artifact")" > "$(basename "$artifact").sha256"
          )
          artifact_sha256="$(sha256sum "$artifact" | awk '{print $1}')"
          tar -tzf "$artifact" >/dev/null

          printf 'release_commit=%s\n' "$release_commit" >> "$GITHUB_ENV"
          printf 'release_sha=%s\n' "$release_sha" >> "$GITHUB_ENV"
          printf 'artifact_sha256=%s\n' "$artifact_sha256" >> "$GITHUB_ENV"
          printf 'artifact=%s\n' "$artifact" >> "$GITHUB_ENV"

      - name: Verify release commit passed main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          successful_ci_runs="$(gh run list \
            --workflow ci.yml \
            --commit "$release_commit" \
            --limit 100 \
            --json status,conclusion,event,headBranch \
            --jq '[.[] | select(.status == "completed" and .conclusion == "success" and .event == "push" and .headBranch == "main")] | length')"

          if test "$successful_ci_runs" -eq 0; then
            printf 'RELEASE_COMMIT_HAS_NO_SUCCESSFUL_MAIN_CI=%s\n' "$release_commit" >&2
            exit 1
          fi

          printf 'release commit passed main CI: %s\n' "$release_commit"

      - name: Prepare SSH files
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          ssh_dir="$RUNNER_TEMP/tetris-ssh"
          install -d -m 700 "$ssh_dir"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/id_rsa"
          printf '%s\n' "$KNOWN_HOSTS" > "$ssh_dir/known_hosts"

          chmod 600 "$ssh_dir/id_rsa" "$ssh_dir/known_hosts"

      - name: Transfer and verify artifact
        env:
          OCI_HOST: ${{ vars.OCI_HOST }}
          OCI_USER: ${{ vars.OCI_USER }}
          OCI_SSH_PORT: ${{ vars.OCI_SSH_PORT }}
          OCI_INCOMING_DIR: ${{ vars.OCI_INCOMING_DIR }}
        run: |
          set -euo pipefail

          test -n "$OCI_INCOMING_DIR"
          remote_artifact="$OCI_INCOMING_DIR/tetris-${release_sha}.tar.gz"
          remote_checksum="$remote_artifact.sha256"

          scp \
            -i "$RUNNER_TEMP/tetris-ssh/id_rsa" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/tetris-ssh/known_hosts" \
            -P "$OCI_SSH_PORT" \
            "$artifact" \
            "$artifact.sha256" \
            "$OCI_USER@$OCI_HOST:$OCI_INCOMING_DIR/"

          ssh \
            -i "$RUNNER_TEMP/tetris-ssh/id_rsa" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/tetris-ssh/known_hosts" \
            -p "$OCI_SSH_PORT" \
            "$OCI_USER@$OCI_HOST" \
            "RELEASE_SHA='$release_sha' REMOTE_ARTIFACT='$remote_artifact' REMOTE_CHECKSUM='$remote_checksum' EXPECTED_ARTIFACT_SHA256='$artifact_sha256' sh -s" <<'REMOTE'
          set -eu

          test -s "$REMOTE_ARTIFACT"
          test -s "$REMOTE_CHECKSUM"
          (cd "$(dirname "$REMOTE_ARTIFACT")" && sha256sum -c "$(basename "$REMOTE_CHECKSUM")")
          actual_artifact_sha256=$(sha256sum "$REMOTE_ARTIFACT" | awk '{print $1}')
          test "$actual_artifact_sha256" = "$EXPECTED_ARTIFACT_SHA256"
          tar -tzf "$REMOTE_ARTIFACT" >/dev/null
          printf 'OCI artifact verified: %s\n' "$RELEASE_SHA"
          REMOTE

      - name: Prepare candidate image
        env:
          OCI_HOST: ${{ vars.OCI_HOST }}
          OCI_USER: ${{ vars.OCI_USER }}
          OCI_SSH_PORT: ${{ vars.OCI_SSH_PORT }}
          OCI_INCOMING_DIR: ${{ vars.OCI_INCOMING_DIR }}
        run: |
          set -euo pipefail

          ssh \
            -i "$RUNNER_TEMP/tetris-ssh/id_rsa" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/tetris-ssh/known_hosts" \
            -p "$OCI_SSH_PORT" \
            "$OCI_USER@$OCI_HOST" \
            "RELEASE_SHA='$release_sha' RELEASE_COMMIT='$release_commit' ARTIFACT_SHA256='$artifact_sha256' OCI_INCOMING_DIR='$OCI_INCOMING_DIR' sh -s" <<'REMOTE'
          set -eu

          artifact="$OCI_INCOMING_DIR/tetris-${RELEASE_SHA}.tar.gz"
          candidate_image="tetris-app:${RELEASE_SHA}"

          test -s "$artifact"
          case "$RELEASE_COMMIT" in
              *[!0-9a-f]*|'') echo "INVALID_RELEASE_COMMIT" >&2; exit 1 ;;
          esac
          test "${#RELEASE_COMMIT}" -eq 40
          case "$RELEASE_COMMIT" in
              "$RELEASE_SHA"*) ;;
              *) echo "RELEASE_SHA_COMMIT_MISMATCH" >&2; exit 1 ;;
          esac
          case "$ARTIFACT_SHA256" in
              *[!0-9a-f]*|'') echo "INVALID_ARTIFACT_SHA256" >&2; exit 1 ;;
          esac
          test "${#ARTIFACT_SHA256}" -eq 64
          sudo docker info >/dev/null

          if sudo docker image inspect "$candidate_image" >/dev/null 2>&1; then
              candidate_exists=yes
          else
              candidate_exists=no
          fi

          sudo install -d -o ubuntu -g ubuntu -m 750 /srv/tetris/builds
          build_directory=$(mktemp -d "/srv/tetris/builds/.${RELEASE_SHA}.XXXXXX")
          cleanupBuildDirectory() {
              rm -rf -- "$build_directory"
          }
          trap cleanupBuildDirectory EXIT
          tar -xzf "$artifact" -C "$build_directory"

          test -f "$build_directory/Dockerfile"
          test -f "$build_directory/compose.production.yml"
          test -f "$build_directory/package.json"

          cd "$build_directory"

          sudo env APP_IMAGE_TAG="$RELEASE_SHA" \
              docker compose \
              --env-file /srv/tetris/secrets/production.env \
              -f compose.production.yml \
              config --quiet

          verifyCandidateImage() {
              image_details=$(sudo docker image inspect "$candidate_image" \
                  --format '{{.Architecture}} {{.Os}} {{.Config.User}} {{json .Config.Cmd}} {{index .Config.Labels "com.docker.compose.project"}} {{index .Config.Labels "com.docker.compose.service"}}') \
                  || return 1
              test "$image_details" = 'amd64 linux node ["node","dist/server/app.js"] tetris app' \
                  || return 1
              image_revision=$(sudo docker image inspect "$candidate_image" \
                  --format '{{index .Config.Labels "org.opencontainers.image.revision"}}') \
                  || return 1
              image_artifact_sha256=$(sudo docker image inspect "$candidate_image" \
                  --format '{{index .Config.Labels "com.tetris.release.artifact-sha256"}}') \
                  || return 1
              if test "$image_revision" != "$RELEASE_COMMIT" \
                  || test "$image_artifact_sha256" != "$ARTIFACT_SHA256"; then
                  echo "CANDIDATE_IMAGE_PROVENANCE_MISMATCH" >&2
                  return 1
              fi
          }

          if test "$candidate_exists" = yes; then
              if ! verifyCandidateImage; then
                  echo "Existing image cannot be safely reused; it was left untouched." >&2
                  exit 1
              fi
              printf 'verified existing candidate image: %s\n' "$candidate_image"
          else
              sudo env APP_IMAGE_TAG="$RELEASE_SHA" \
                  docker compose \
                  --env-file /srv/tetris/secrets/production.env \
                  -f compose.production.yml \
                  build \
                  --build-arg "RELEASE_COMMIT=${RELEASE_COMMIT}" \
                  --build-arg "RELEASE_ARTIFACT_SHA256=${ARTIFACT_SHA256}" \
                  app
              verifyCandidateImage
          fi

          sudo docker image inspect "$candidate_image" \
              --format \
              'tags={{json .RepoTags}} architecture={{.Architecture}} size={{.Size}}'

          printf 'candidate image prepared: %s\n' "$RELEASE_SHA"
          REMOTE

      - name: Back up and verify production database
        env:
          OCI_HOST: ${{ vars.OCI_HOST }}
          OCI_USER: ${{ vars.OCI_USER }}
          OCI_SSH_PORT: ${{ vars.OCI_SSH_PORT }}
        run: |
          set -euo pipefail

          ssh \
            -i "$RUNNER_TEMP/tetris-ssh/id_rsa" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/tetris-ssh/known_hosts" \
            -p "$OCI_SSH_PORT" \
            "$OCI_USER@$OCI_HOST" \
            "RELEASE_SHA='$release_sha' sh -s" <<'REMOTE'
          set -eu
          umask 077

          case "$RELEASE_SHA" in
              *[!0-9a-f]*|'')
                  echo "INVALID_RELEASE_SHA" >&2
                  exit 1
                  ;;
          esac
          test "${#RELEASE_SHA}" -eq 7

          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          backup="/srv/tetris/backups/tetris-${RELEASE_SHA}-${timestamp}.dump"
          temporary="${backup}.tmp"

          sudo install -d -o ubuntu -g ubuntu -m 700 /srv/tetris/backups
          test ! -e "$backup"
          test ! -e "$temporary"

          cleanupTemporary() {
              test ! -e "$temporary" || rm -f -- "$temporary"
          }
          trap cleanupTemporary EXIT

          sudo docker compose \
              --env-file /srv/tetris/secrets/production.env \
              -f /srv/tetris/repository/compose.production.yml \
              exec -T postgres \
              pg_dump \
              --username postgres \
              --dbname tetris \
              --format=custom \
              > "$temporary"

          test -s "$temporary"
          sudo docker compose \
              --env-file /srv/tetris/secrets/production.env \
              -f /srv/tetris/repository/compose.production.yml \
              exec -T postgres \
              pg_restore --list \
              < "$temporary" \
              >/dev/null

          mv "$temporary" "$backup"
          chmod 400 "$backup"
          trap - EXIT

          sha256sum "$backup"
          stat -c '%a %U:%G %s %n' "$backup"
          printf 'production database backup verified: %s\n' "$backup"
          REMOTE

      - name: Apply and verify database migrations
        env:
          OCI_HOST: ${{ vars.OCI_HOST }}
          OCI_USER: ${{ vars.OCI_USER }}
          OCI_SSH_PORT: ${{ vars.OCI_SSH_PORT }}
        run: |
          set -euo pipefail

          ssh \
            -i "$RUNNER_TEMP/tetris-ssh/id_rsa" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/tetris-ssh/known_hosts" \
            -p "$OCI_SSH_PORT" \
            "$OCI_USER@$OCI_HOST" \
            "RELEASE_SHA='$release_sha' sh -s" <<'REMOTE'
          set -eu
          case "$RELEASE_SHA" in
              *[!0-9a-f]*|'')
                  echo "INVALID_RELEASE_SHA" >&2
                  exit 1
                  ;;
          esac
          test "${#RELEASE_SHA}" -eq 7

          active_app=$(sudo docker compose \
              --env-file /srv/tetris/secrets/production.env \
              -f /srv/tetris/repository/compose.production.yml ps -q app)
          test -n "$active_app"
          version_probe='require("./dist/server/server/services/runtimeEventStorage.js").EXPECTED_POSTGRES_MIGRATION_VERSION'
          active_version=$(sudo docker exec "$active_app" node -p "$version_probe")
          candidate_version=$(sudo docker run --rm "tetris-app:${RELEASE_SHA}" node -p "$version_probe")
          if test "$active_version" != "$candidate_version"; then
              echo "SCHEMA_TRANSITION_REQUIRES_MANUAL_CUTOVER: prepare a compatible rollback and drain traffic before migration" >&2
              exit 1
          fi

          runMigration() {
              sudo docker run --rm \
                  --network tetris_database \
                  --mount type=bind,src=/srv/tetris/certs/ca.crt,dst=/run/secrets/postgres-ca.crt,readonly \
                  --env-file /srv/tetris/secrets/migration.env \
                  --env NODE_EXTRA_CA_CERTS=/run/secrets/postgres-ca.crt \
                  "tetris-app:${RELEASE_SHA}" \
                  node dist/server/server/db/migrateCli.js
          }

          first_result="$(runMigration)"
          printf '%s\n' "$first_result"
          printf '%s\n' "$first_result" \
              | grep -Eq '^PostgreSQL migrations applied=[0-9]+ skipped=[0-9]+$'

          second_result="$(runMigration)"
          printf '%s\n' "$second_result"
          printf '%s\n' "$second_result" \
              | grep -Eq '^PostgreSQL migrations applied=0 skipped=[1-9][0-9]*$'

          printf 'database migrations verified: %s\n' "$RELEASE_SHA"
          REMOTE

      - name: Activate and verify production app
        env:
          OCI_HOST: ${{ vars.OCI_HOST }}
          OCI_USER: ${{ vars.OCI_USER }}
          OCI_SSH_PORT: ${{ vars.OCI_SSH_PORT }}
        run: |
          set -euo pipefail

          ssh \
            -i "$RUNNER_TEMP/tetris-ssh/id_rsa" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/tetris-ssh/known_hosts" \
            -p "$OCI_SSH_PORT" \
            "$OCI_USER@$OCI_HOST" \
            "RELEASE_SHA='$release_sha' RELEASE_COMMIT='$release_commit' bash -s" <<'REMOTE'
          set -euo pipefail

          case "$RELEASE_SHA" in
              *[!0-9a-f]*|'')
                  echo "INVALID_RELEASE_SHA" >&2
                  exit 1
                  ;;
          esac
          test "${#RELEASE_SHA}" -eq 7

          env_file=/srv/tetris/secrets/production.env
          compose_file=/srv/tetris/repository/compose.production.yml
          current_tag=$(sed -n 's/^APP_IMAGE_TAG=//p' "$env_file")
          test "$(grep -c '^APP_IMAGE_TAG=' "$env_file")" -eq 1
          case "$current_tag" in
              *[!0-9a-f]*|'')
                  echo "INVALID_CURRENT_IMAGE_TAG" >&2
                  exit 1
                  ;;
          esac
          if [[ ! "$current_tag" =~ ^[0-9a-f]{7,40}$ ]]; then
              echo "INVALID_CURRENT_IMAGE_TAG" >&2
              exit 1
          fi
          sudo docker image inspect "tetris-app:${current_tag}" >/dev/null
          sudo docker image inspect "tetris-app:${RELEASE_SHA}" >/dev/null

          setImageTag() {
              image_tag=$1
              temporary=$(mktemp /srv/tetris/secrets/production.env.XXXXXX) || return 1
              if ! sed "s/^APP_IMAGE_TAG=.*/APP_IMAGE_TAG=${image_tag}/" \
                  "$env_file" > "$temporary"; then
                  rm -f -- "$temporary"
                  return 1
              fi
              if ! test "$(grep -c '^APP_IMAGE_TAG=' "$temporary")" -eq 1 \
                  || ! chmod 600 "$temporary" \
                  || ! mv "$temporary" "$env_file"; then
                  rm -f -- "$temporary"
                  return 1
              fi
              return 0
          }

          replaceApp() {
              sudo docker compose \
                  --env-file "$env_file" \
                  -f "$compose_file" \
                  up -d --no-deps --no-build --force-recreate --wait app
          }

          verifyApp() {
              app_id=$(sudo docker compose \
                  --env-file "$env_file" \
                  -f "$compose_file" \
                  ps -q app) || return 1
              test -n "$app_id" || return 1
              actual=$(sudo docker inspect "$app_id" \
                  --format '{{.Config.Image}} {{.State.Status}} {{.State.Health.Status}} {{.State.OOMKilled}}') \
                  || return 1
              test "$actual" = "tetris-app:${expected_tag} running healthy false" \
                  || return 1

              http_status=$(curl -fsS \
                  --retry 10 \
                  --retry-delay 2 \
                  --retry-all-errors \
                  -o /dev/null \
                  -w '%{http_code}' \
                  https://tetra-arena.duckdns.org) || return 1
              test "$http_status" = 200 || return 1
          }

          diagnoseCandidate() {
              app_id=$(sudo docker compose \
                  --env-file "$env_file" \
                  -f "$compose_file" \
                  ps -aq app | head -n 1) || app_id=
              if test -z "$app_id"; then
                  echo "CANDIDATE_CONTAINER_NOT_FOUND" >&2
                  return 0
              fi

              image=$(sudo docker inspect "$app_id" --format '{{.Config.Image}}') \
                  || image=unknown
              if test "$image" != "tetris-app:${RELEASE_SHA}"; then
                  printf 'CANDIDATE_CONTAINER_NOT_FOUND; found image=%s\n' "$image" >&2
                  return 0
              fi

              echo "Candidate container state:"
              sudo docker inspect "$app_id" \
                  --format 'image={{.Config.Image}} status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}}' \
                  || true
              echo "Candidate healthcheck history:"
              sudo docker inspect "$app_id" \
                  --format '{{if .State.Health}}{{json .State.Health}}{{else}}no-healthcheck{{end}}' \
                  || true
              echo "Candidate application logs (last 80 lines):"
              sudo docker logs --timestamps --tail=80 "$app_id" 2>&1 \
                  || true
          }

          rollback() {
              echo "Deployment verification failed; restoring ${current_tag}" >&2
              if ! setImageTag "$current_tag" || ! replaceApp; then
                  echo "ROLLBACK_FAILED: app could not be recreated" >&2
                  return 1
              fi
              expected_tag=$current_tag
              if ! verifyApp; then
                  echo "ROLLBACK_FAILED: restored app did not pass health checks" >&2
                  return 1
              fi
              echo "rollback verified: ${current_tag}"
          }

          if test "$current_tag" = "$RELEASE_SHA" \
              || test "$current_tag" = "$RELEASE_COMMIT"; then
              expected_tag=$current_tag
              if verifyApp; then
                  printf 'release already active and healthy: %s\n' "$RELEASE_SHA"
                  exit 0
              fi
              echo "CURRENT_RELEASE_UNHEALTHY; manual recovery is required" >&2
              exit 1
          fi

          setImageTag "$RELEASE_SHA"
          expected_tag=$RELEASE_SHA
          if ! replaceApp || ! verifyApp; then
              diagnoseCandidate || true
              rollback || true
              exit 1
          fi

          printf 'production app activated and verified: %s (previous=%s)\n' \
              "$RELEASE_SHA" "$current_tag"
          REMOTE
